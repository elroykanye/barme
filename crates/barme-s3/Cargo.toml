[package]
name = "barme-s3"
version = "0.1.0"
edition.workspace = true
license.workspace = true

[dependencies]
barme-engine.workspace = true
barme-auth.workspace = true
axum.workspace = true
tokio.workspace = true
tokio-util.workspace = true
futures-util.workspace = true
hex.workspace = true
# `parsing` on top of the workspace `formatting`: manifests record RFC3339 and
# ListObjectsV2's LastModified is UTC-with-milliseconds, so timestamps are read
# back in and reformatted.
time = { workspace = true, features = ["parsing"] }
tower-http = { version = "0.6", features = ["trace"] }

[dev-dependencies]
tower = { version = "0.5", features = ["util"] }
tempfile = "3"
http-body-util = "0.1"
